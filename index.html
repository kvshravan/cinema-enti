<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cinema Enti?</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="app">

  <header>
    <div class="brand">🎬 Cinema Enti?</div>
    <div class="subtitle">Ee roju cinema ento kanipettu ra!</div>
  </header>

  <section class="hero">

    <div class="date" id="date"></div>

    <h1>Ee roju challenge </h1>

    <div class="mode-tabs">
      <button data-mode="easy" class="mode active">
        Easy
      </button>

      <button data-mode="hard" class="mode">
        Hard
      </button>

      <button data-mode="ultra_hard" class="mode">
        Ultra Hard
      </button>
    </div>

    <p class="mode-desc" id="modeDesc"></p>

    <div class="player">

      <button id="playBtn" class="play">
        ▶
      </button>

      <div class="player-text">
        <strong>Dialogue vinu 🎧</strong>

        <div class="small">
          Vini cinema peru cheppu!
        </div>
      </div>

      <audio
        id="audio"
        controls
        preload="none">
      </audio>

    </div>

    <div class="attempts" id="attempts"></div>

    <input
      id="guess"
      autocomplete="off"
      placeholder="Cinema peru enti?"
    />

    <button id="guessBtn" class="guess">
      CHEPPU RA 😎
    </button>

    <div class="clues" id="clues"></div>

    <div id="message"></div>

    <!-- SHARE RESULT -->

    <div
      id="shareSection"
      class="share-section"
      style="display:none;"
    >

      <div class="share-title">
        🎬 Today's Result
      </div>

      <pre
        id="sharePreview"
        class="share-preview"
      ></pre>

      <button
        id="shareBtn"
        class="share-btn"
      >
        📤 SHARE RESULT
      </button>

    </div>

  </section>

  <section class="how">

    <h2>Ela aadali?</h2>

    <p>
      Dialogue vinu, cinema peru guess cheyyi.
      Enni takkuva attempts lo kanipedithe antha mass !
    </p>

  </section>

</main>

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () {
    (window.vaq = window.vaq || []).push(arguments);
  };
</script>

<script defer src="/_vercel/insights/script.js"></script>

<!-- Game -->
<script src="app.js"></script>

</body>
</html>
